<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runs before first paint so a dark-mode user never sees an ivory flash.
      // Mirrors themeStore's resolution; kept tiny and dependency-free.
      (function () {
        try {
          var raw = localStorage.getItem('jut-office-theme');
          var t = raw ? (JSON.parse(raw).state || {}).theme : 'system';
          var r =
            t === 'dark' || t === 'light'
              ? t
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Internal tool. It must never appear in a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>JUSTUSED Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
